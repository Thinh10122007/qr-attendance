<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cổng Điểm Danh Trực Tuyến</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between p-4">
  <div class="max-w-md w-full mx-auto space-y-4">
    
    <div class="text-center pt-4">
      <div class="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-user-check"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-900 mt-3">Xác Nhận Điểm Danh</h1>
      <p class="text-xs text-slate-500">Vui lòng điền thông tin bên dưới để hoàn tất</p>
    </div>

    <!-- Hộp thông tin Token -->
    <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
      <div>
        <span class="text-slate-400 block text-[10px]">MÃ TOKEN PHÒNG</span>
        <strong id="displayToken" class="font-mono text-indigo-700 font-bold text-sm">--</strong>
      </div>
      <span id="tokenStatusBadge" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-700">
        <i class="fa-solid fa-circle-check mr-1"></i> Hợp lệ
      </span>
    </div>

    <!-- Form nhập thông tin -->
    <form id="checkinForm" onsubmit="submitAttendance(event)" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">MÃ SỐ SINH VIÊN / NHÂN VIÊN (*)</label>
        <input type="text" id="studentId" required placeholder="Ví dụ: 20D941001"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">HỌ VÀ TÊN (*)</label>
        <input type="text" id="fullName" required placeholder="Ví dụ: Nguyễn Văn A"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">LỚP / PHÒNG BAN (*)</label>
        <input type="text" id="className" required placeholder="Ví dụ: CNTT-K44"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="saveLocal" checked class="w-4 h-4 accent-indigo-600 rounded">
        <label for="saveLocal" class="text-xs text-slate-500">Ghi nhớ thông tin cho lần điểm danh sau</label>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-indigo-200 transition text-sm">
        Xác Nhận Điểm Danh
      </button>
    </form>

    <!-- Hộp thông báo kết quả -->
    <div id="resultBox" class="hidden p-4 rounded-2xl text-center text-sm font-semibold"></div>
  </div>

  <footer class="text-center text-[11px] text-slate-400 py-3">
    Hệ thống Điểm Danh QR Động &copy; 2026
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Kiểm tra Token từ URL
      if (!token) {
        document.getElementById('displayToken').textContent = 'KHÔNG CÓ';
        document.getElementById('tokenStatusBadge').className = 'px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-100 text-rose-700';
        document.getElementById('tokenStatusBadge').innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Thiếu mã';
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        document.getElementById('displayToken').textContent = token;
      }

      // 2. Điền lại thông tin đã lưu từ LocalStorage
      if (localStorage.getItem('saved_studentId')) {
        document.getElementById('studentId').value = localStorage.getItem('saved_studentId');
        document.getElementById('fullName').value = localStorage.getItem('saved_fullName');
        document.getElementById('className').value = localStorage.getItem('saved_className');
      }
    });

    async function submitAttendance(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const box = document.getElementById('resultBox');

      const payload = {
        token: token,
        studentId: document.getElementById('studentId').value.trim(),
        fullName: document.getElementById('fullName').value.trim(),
        className: document.getElementById('className').value.trim()
      };

      if (document.getElementById('saveLocal').checked) {
        localStorage.setItem('saved_studentId', payload.studentId);
        localStorage.setItem('saved_fullName', payload.fullName);
        localStorage.setItem('saved_className', payload.className);
      }

      btn.disabled = true;
      btn.textContent = 'Đang gửi xác nhận...';
      box.className = 'hidden';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        box.classList.remove('hidden');
        if (data.success) {
          box.className = 'p-4 rounded-2xl text-center text-sm font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
          box.innerHTML = `<i class="fa-solid fa-circle-check text-xl block mb-1"></i> ${data.message}`;
          document.getElementById('checkinForm').style.display = 'none';
        } else {
          box.className = 'p-4 rounded-2xl text-center text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200';
          box.innerHTML = `<i class="fa-solid fa-circle-xmark text-xl block mb-1"></i> ${data.message}`;
          btn.disabled = false;
          btn.textContent = 'Thử lại';
        }
      } catch (err) {
        box.classList.remove('hidden');
        box.className = 'p-4 rounded-2xl text-center text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200';
        box.textContent = 'Lỗi kết nối máy chủ! Hãy kiểm tra mạng Wi-Fi.';
        btn.disabled = false;
        btn.textContent = 'Xác Nhận Điểm Danh';
      }
    }
  </script>
</body>
</html>
